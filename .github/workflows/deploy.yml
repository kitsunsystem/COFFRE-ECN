# Production deployment, started by hand (Actions › Deploy › Run workflow) once the accounts exist, or by Release.
# Needs, in Settings › Secrets and variables › Actions:
#   variables: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_PROJECT_REF, CF_PAGES_PROJECT, FIDO_RP_ID
#   secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Self-hosted Supabase (OVHcloud HDS): skip the "backend" job and apply migrations with psql (deploy/README.md).
# Each part runs only when its keys are set: without Cloudflare yet, only the database and the functions are deployed.
name: Deploy

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      backend:
        description: "Database migrations and server functions"
        type: boolean
        default: true
      web:
        description: "Website (Cloudflare Pages)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    if: inputs.backend && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase functions deploy

  web:
    needs: [backend]
    # Runs even when the backend job was skipped (self-hosted backend).
    if: always() && inputs.web && vars.SUPABASE_URL != '' && vars.CF_PAGES_PROJECT != '' && needs.backend.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: bash scripts/ci-run.sh npm ci
      - run: bash scripts/ci-run.sh npm test
      - run: bash scripts/ci-run.sh npm run build:prod
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_FIDO_RP_ID: ${{ vars.FIDO_RP_ID }}
          NEXT_PUBLIC_APP_URL: https://${{ vars.FIDO_RP_ID }}
          NEXT_PUBLIC_PUSH: ${{ vars.PUSH }}
          NEXT_PUBLIC_STORE_IOS: ${{ vars.STORE_IOS }}
          NEXT_PUBLIC_STORE_ANDROID: ${{ vars.STORE_ANDROID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
