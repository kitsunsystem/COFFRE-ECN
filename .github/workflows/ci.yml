# Every push: code checks, unit tests, database access rules (PGlite), both builds,
# then the full production path on a real Supabase stack (Docker on the runner).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Code, tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: bash scripts/ci-run.sh npm ci
      - run: bash scripts/ci-run.sh npm run lint
      - run: bash scripts/ci-run.sh npm run typecheck
      - name: Unit tests and database access rules
        run: bash scripts/ci-run.sh npm test
      - name: Demo build
        run: bash scripts/ci-run.sh npm run build
      - name: Production build (with security headers)
        run: bash scripts/ci-run.sh npm run build:prod
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - run: bash scripts/ci-run.sh npm audit --omit=dev --audit-level=high

  supabase:
    name: Production path on a real Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: bash scripts/ci-run.sh npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start Supabase (migrations applied, functions served)
        run: bash scripts/ci-run.sh supabase start
      - name: Database lint (functions and policies)
        run: bash scripts/ci-run.sh supabase db lint --level error
      - name: Export the local keys
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      - name: End-to-end
        run: bash scripts/ci-run.sh npm run test:e2e
      - name: Function logs on failure
        if: failure()
        run: docker logs $(docker ps -q --filter name=supabase_edge_runtime) 2>&1 | tail -n 200
