# Supabase project config (local development, tests, and `supabase config push`).
# Link the real project once it exists: `supabase link --project-ref <ref>`.
project_id = "sillage"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Local only: catches every e-mail sent by Supabase Auth (codes, address changes) at http://localhost:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "30MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# The website, the native app (Capacitor) and local development.
additional_redirect_urls = ["capacitor://localhost", "https://localhost", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# The Espace opens with e-mail + password (the Coffre never does: card + code, or the phone for a computer).
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
# 6-digit codes (no links, the same on the website and in the app): confirm a new address, reset a forgotten password.
otp_length = 6
otp_expiry = 3600

# Written in the language of the account (user metadata "lang", sent at sign-up and when it changes in the app).
[auth.email.template.confirmation]
subject = '{{ $l := printf "%v" .Data.lang }}{{ if eq $l "en" }}Confirm your address{{ else if eq $l "es" }}Confirme su dirección{{ else if eq $l "ca" }}Confirmeu la vostra adreça{{ else }}Confirmez votre adresse{{ end }}'
content_path = "./supabase/templates/code.html"

[auth.email.template.recovery]
subject = '{{ $l := printf "%v" .Data.lang }}{{ if eq $l "en" }}Your code to change your password{{ else if eq $l "es" }}Su código para cambiar la contraseña{{ else if eq $l "ca" }}El vostre codi per canviar la contrasenya{{ else }}Votre code pour changer de mot de passe{{ end }}'
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = '{{ $l := printf "%v" .Data.lang }}{{ if eq $l "en" }}Confirm your new address{{ else if eq $l "es" }}Confirme su nueva dirección{{ else if eq $l "ca" }}Confirmeu la vostra nova adreça{{ else }}Confirmez votre nouvelle adresse{{ end }}'
content_path = "./supabase/templates/email-change.html"

[edge_runtime]
enabled = true
policy = "per_worker"

# Internal functions (cron, webhooks) check the service role key or a signature themselves.
[functions.mailer]
verify_jwt = false

[functions.insee-watch]
verify_jwt = false

[functions.procedures-tick]
verify_jwt = false

[functions.relances]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.kyc-webhook]
verify_jwt = false

# Called from the app with the user's session.
[functions.billing]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.push]
verify_jwt = true
