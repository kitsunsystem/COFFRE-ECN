# Supabase project config (local development, tests, and `supabase config push`).
# Link the real project once it exists: `supabase link --project-ref <ref>`.
project_id = "sillage"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Local only: catches every e-mail sent by Supabase Auth (codes, address changes) at http://localhost:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "30MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# The website, the native app (Capacitor) and local development.
additional_redirect_urls = ["capacitor://localhost", "https://localhost", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
# Sign-in with a 6-digit code: no password, works the same on the website and in the app.
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Votre code de connexion"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Votre code de connexion"
content_path = "./supabase/templates/code.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse"
content_path = "./supabase/templates/email-change.html"

[edge_runtime]
enabled = true
policy = "per_worker"

# Internal functions (cron, webhooks) check the service role key or a signature themselves.
[functions.mailer]
verify_jwt = false

[functions.insee-watch]
verify_jwt = false

[functions.procedures-tick]
verify_jwt = false

[functions.relances]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.kyc-webhook]
verify_jwt = false

# Called from the app with the user's session.
[functions.assistant]
verify_jwt = true

[functions.billing]
verify_jwt = true

[functions.account-delete]
verify_jwt = true
